name: CI - Qualidade e Build

on:
  push:
    branches: ["master", "main", "ux/*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint (Oxlint)
        run: npm run lint
        
      - name: Testes Unitários (Vitest)
        run: npm test
        
      - name: Typecheck, Build e Orçamento
        run: npm run build
